version: 2
updates:
  # NuGet: haftalık, küçük/yama güncellemeleri tek PR'da; majör yükseltmeler ayrı değerlendirilir.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # PDFsharp 6.5.0 ve sonrası AGPL-3.0; 6.2.4 (MIT) sabit kalır (REPORT-007).
      - dependency-name: "PDFsharp*"
        versions: [">= 6.3.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
